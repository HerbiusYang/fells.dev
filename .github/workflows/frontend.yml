name: Frontend checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_REQUIRE_BROWSERS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:coverage
      - name: Preserve onboarding browser review images
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: claude-onboarding-${{ github.sha }}
          path: test-results/claude-onboarding/
          retention-days: 14
          if-no-files-found: error
      - name: Preserve package catalog and WorkBuddy visual review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: package-audit-${{ github.sha }}
          path: test-results/package-audit/
          retention-days: 14
          if-no-files-found: warn
      - name: Build production frontend
        run: |
          unset SUPPORT_PORTAL_PATH
          pnpm build
          python3 scripts/release-artifact.py --out "$RUNNER_TEMP/frontend-release"
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-release-${{ github.sha }}
          path: ${{ runner.temp }}/frontend-release/
          retention-days: 14
          if-no-files-found: error
