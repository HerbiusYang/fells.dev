name: Frontend checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:dependencies
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:coverage
      - name: Preserve onboarding browser review images
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: claude-onboarding-${{ github.sha }}
          path: test-results/claude-onboarding/
          retention-days: 14
          if-no-files-found: error
      - name: Preserve package catalog and WorkBuddy visual review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-audit-${{ github.sha }}
          path: test-results/package-audit/
          retention-days: 14
          if-no-files-found: warn
      - name: Build production frontend
        run: |
          unset SUPPORT_PORTAL_PATH
          pnpm build
          python3 scripts/release-artifact.py --out "$RUNNER_TEMP/frontend-release"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-release-${{ github.sha }}
          path: ${{ runner.temp }}/frontend-release/
          retention-days: 14
          if-no-files-found: error
